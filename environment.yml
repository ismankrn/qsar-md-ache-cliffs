# Recreate with:  conda env create -f environment.yml
# On a Linux/CUDA box conda-forge resolves the CUDA-enabled OpenMM build automatically.
name: qsar-md
channels:
  - conda-forge
dependencies:
  # --- simulation ---
  - python=3.11
  - openmm=8.6
  - openmmforcefields=0.16
  - openff-toolkit=0.18
  - pdbfixer
  # --- docking ---
  # meeko must be >=0.8: the 0.6 conda build ships without its params/ data
  # directory and mk_prepare_receptor.py fails on a missing ad4_types.json
  - vina=1.2.7
  - meeko=0.8
  # --- cheminformatics and analysis ---
  - rdkit
  - mdanalysis
  - mdtraj
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - propka
  - requests
  - tqdm
  - joblib
  # --- optional, local work only ---
  - jupyterlab
  - py3dmol
